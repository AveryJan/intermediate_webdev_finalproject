<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calculate simple interest and total repayment from principal, annual interest rate, and time in years.">
  <title>Interest Rate Calculator | Simple Interest</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator">
    <h1>Interest Rate Calculator</h1>
    <p>Calculate simple interest and your final balance.</p>
    <form id="interest-form">
      <label for="principal">Principal amount ($)</label>
      <input id="principal" type="number" min="0" step="any" required placeholder="1000">
      <label for="rate">Annual interest rate (%)</label>
      <input id="rate" type="number" min="0" step="any" required placeholder="5">
      <label for="time">Time (years)</label>
      <input id="time" type="number" min="0" step="any" required placeholder="2">
      <button type="submit">Calculate</button>
    </form>
    <section aria-live="polite" class="results">
      <h2>Results</h2>
      <p>Simple interest: <strong id="interest">$0.00</strong></p>
      <p>Total amount: <strong id="totalAmount">$0.00</strong></p>
    </section>
  </main>
</body>
</html>
