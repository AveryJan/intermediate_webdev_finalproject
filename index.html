<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Simple Interest Calculator</title>

    <meta name="description"
          content="Calculate simple interest and total repayment amounts using this interactive Interest Rate Calculator.">

    <!-- Favicon -->
    <link rel="icon"
          type="image/x-icon"
          href="favicon.ico">

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <h1>Simple Interest Calculator</h1>

    <main>
        <h2>Calculate Your Interest</h2>

        <label for="principal">Principal Amount:</label>
        <input type="number" id="principal">

        <br><br>

        <label for="rate">Interest Rate (%):</label>
        <input type="number" id="rate">

        <br><br>

        <label for="time">Time (Years):</label>
        <input type="number" id="time">

        <br><br>

        <button type="button" onclick="calculateInterest()">
            Calculate Interest
        </button>

        <h2>Results</h2>

        <p id="interest"></p>

        <p id="total"></p>

    </main>

</body>
</html>
