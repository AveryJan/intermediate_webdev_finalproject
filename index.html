<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Interest Calculator</title>

    <meta
        name="description"
        content="Calculate simple interest and total amounts using our easy-to-use Simple Interest Calculator."
    >

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>
    <h1>Simple Interest Calculator</h1>

    <main>
        <section>
            <h2>Calculate Simple Interest</h2>

            <label for="principal">Principal Amount:</label>
            <input type="number" id="principal" min="0" step="any">

            <br><br>

            <label for="rate">Annual Interest Rate (%):</label>
            <input type="number" id="rate" min="0" step="any">

            <br><br>

            <label for="time">Time (Years):</label>
            <input type="number" id="time" min="0" step="any">

            <br><br>

            <button type="button" onclick="calculateInterest()">
                Calculate Interest
            </button>

            <p id="interest"></p>
            <p id="total"></p>
        </section>
    </main>
</body>
</html>
